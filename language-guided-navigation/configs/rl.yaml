model:
  # Run: python scripts/download_model.py
  # Then point this to the printed local path, e.g.:
  # name: "models/qwen/Qwen2.5-0.5B-Instruct"
  name: "./models/Qwen2.5-0.5B-Instruct"
  sft_checkpoint: "outputs/sft"
  torch_dtype: "float32"
  device_map: "auto"

data:
  num_tasks: 100
  seed: 42

env:
  size: 5
  max_steps: 15

training:
  num_epochs: 5
  episodes_per_epoch: 20
  learning_rate: 1.0e-5
  kl_beta: 0.01
  grad_clip: 1.0
  max_new_tokens: 64

output:
  dir: "outputs/rl"
