model:
  name: "Qwen/Qwen2.5-0.5B-Instruct"
  torch_dtype: "float32"
  device_map: "auto"

lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "v_proj"

data:
  num_tasks: 500
  seed: 42

env:
  size: 5

training:
  num_epochs: 3
  batch_size: 4
  learning_rate: 5.0e-5
  max_length: 256
  grad_clip: 1.0

output:
  dir: "outputs/sft"
