model:
  name: "./models/Qwen2.5-0.5B-Instruct" 
  torch_dtype: "float16"
  device_map: null              

lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "v_proj"
  task_type: "CAUSAL_LM"

training:
  output_dir: "./checkpoints/sft"
  num_epochs: 3
  batch_size: 1                 
  gradient_accumulation_steps: 8  
  learning_rate: 5.0e-5
  warmup_steps: 10
  max_seq_length: 256           
  logging_steps: 10
  save_steps: 50
  seed: 42
  gradient_checkpointing: true  

data:
  trajectory_file: "./data/sft_trajectories.jsonl"
  max_samples: 150